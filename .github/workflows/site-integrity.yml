name: Site integrity

# 手动触发（workflow_dispatch）——本仓 CI 只在本地跑，不在 GitHub 跑（省 Actions 额度）。
# 本地等价：python3 scripts/verify_sitemap.py。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/verify_sitemap.py
